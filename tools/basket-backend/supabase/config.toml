project_id = "basket-local"

[api]
enabled = true
port = 54331
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54332
shadow_port = 54330
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54334

[storage]
enabled = false

[auth]
enabled = true
site_url = "https://bobbyinscoe.com/basket"
additional_redirect_urls = []
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = false
max_frequency = "60s"
otp_length = 8
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Basket sign-in code"
content_path = "./supabase/templates/code.html"

[auth.email.template.email_change]
subject = "Verify your Basket email"
content_path = "./supabase/templates/code.html"
