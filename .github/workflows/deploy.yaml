name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # Public values only: the project URL and publishable key are visible in any built site.
        env:
          VITE_HOUSE_SCANNER_ENABLED: ${{ vars.VITE_HOUSE_SCANNER_ENABLED }}
          VITE_HOUSE_SCANNER_SUPABASE_URL: ${{ vars.VITE_HOUSE_SCANNER_SUPABASE_URL }}
          VITE_HOUSE_SCANNER_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_HOUSE_SCANNER_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: SPA 404 Redirect Handling
        run: cp dist/index.html dist/404.html

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4